  # Proyecto pequeño - full brief, kept here so it isn't lost:
  # One 1-minute video per block, single take (no cuts), phone-recorded,
  # influencer/live style, face on screen the whole minute. Steps: record ->
  # auto-generate captions (Instagram/TikTok built-in) -> manually correct
  # the captions to match exactly what you said -> self-evaluate against the
  # rubric using the self-eval prompt below (recommended, not graded) -> run
  # the corrected transcript through the language-correction prompt below.
  # Submit (in the session's doc tab): video link, corrected captions, and
  # the link/export of both AI conversations (self-eval + correction).
  #
  # Rubric: Pertinencia temática 40% (uses the block's vocabulary/concepts
  # precisely, concrete examples), Fluidez de la toma 30% (visible prep,
  # fluent, few filler words, no long blocks), Precisión del subtitulado
  # corregido 30% (captions match exactly what was said, careful correction
  # incl. the AI work).
  #
  # Self-eval prompt (paste into Gemini with your corrected captions + the
  # rubric above): "Te comparto la transcripción corregida de mi video de un
  # minuto sobre [tema del bloque], y la rúbrica de evaluación de mi
  # profesor. Por favor: Evalúa mi texto según los tres criterios de la
  # rúbrica (pertinencia temática, fluidez del take único según lo que
  # refleja el texto, precisión aparente del contenido). Para cada criterio,
  # dime en qué nivel estaría (excelente, adecuado o insuficiente) y por
  # qué. Señala qué cambiarías para subir de nivel en cada criterio, sin
  # reescribir el texto completo por mí. No me des una nota numérica, solo
  # el nivel cualitativo por criterio."
  #
  # Language-correction prompt: "Voy a compartirte la transcripción
  # corregida de mi video de un minuto en español sobre [tema del bloque].
  # Por favor: Señala cada error, pero no reescribas la frase completa,
  # solo indica qué está mal. Explica brevemente la regla gramatical o de
  # uso detrás de cada corrección. Revisa si usé bien el vocabulario
  # específico del tema. No me des una versión corregida completa del
  # texto, solo la lista de observaciones."
  - id: spanish-video-project-1
