# Assignments / exams. Urgency (days remaining) and the red/yellow/green
# color are computed automatically from `due_date` + `weight_pct` on every
# run - never set those by hand.
#
# Filled in 2026-09-13 from ESSEC syllabuses, the "Grading Breakdown per
# class.docx" summary, and real session dates from the ICS calendar feed
# (syllabuses give due dates as "Session N"; the calendar gives the actual
# date for session N).
#
# Still missing / needs confirming once ESSEC publishes them:
# - Cost & Budgets final exam: "early December", exact date TBD by admin.
# - Finance final exam: "early December", exact date TBD by admin.
# - International Economics MCQ final exam (20%): exam-period date TBD.
# - Marketing Research final exam (30%): exam-period date TBD.
# - Business Law group presentation (50%) and final exam (50%): no syllabus
#   PDF was found for this course (only Session 1-2 lesson slides), so
#   neither a date nor a session number is known yet.
# - Communication Skills: individual participation (20%) has no single due
#   date, so it isn't listed as a deadline.
# - Spanish: midterm exam is known to fall during Session 5, but its weight
#   isn't broken out separately - it's folded into the 60% "Control
#   Continuo" bucket along with ongoing projects and participation across
#   the whole semester, so no clean single weight_pct exists for it alone.
#   Final exam (40%: 20% individual project + 20% written) has no date.
# - Chinese: midterm (20%, oral+written) and final exam (40%, oral+written)
#   are both mentioned but no session number or date was given for either.
# Add each once ESSEC/Moodle confirms it - same shape as the entries below.
#
# Spanish "Proyecto pequeño" added 2026-09-14: three 1-minute one-take
# videos, one per thematic block, worth "20% de la nota de control
# continuo" per the assignment brief. Since Control Continuo is itself 60%
# of the overall course grade, 20% of it is 12% of the whole course - split
# evenly across the 3 videos (confirmed 2026-09-14: equal split), so 4%
# each, which is what's entered below. The brief gives "entrega orientativa"
# as a 2-session range per video, not a hard date - due_date below uses the
# later session in each range as the conservative deadline.
#
