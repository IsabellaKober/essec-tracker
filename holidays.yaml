# ESSEC academic-calendar breaks/holidays. Not represented as events in the
# ICS feed (confirmed 2026-09-14 - they're just gaps in the class schedule,
# not calendar entries), so tracked by hand here instead, the same way
# deadlines.yaml tracks assignments the calendar doesn't carry.
#
# The dashboard's "next break" countdown reads whichever entry below starts
# soonest (today or later) - entries fully in the past are ignored
# automatically, no need to remove them. `end_date` may be omitted for a
# single-day holiday (defaults to `start_date`).
#
# `count_from` (optional) draws the progress bar: the term/period start date
# to measure "how far through the wait" from. Omit it and the widget just
# shows the days-remaining text with no bar.
#
# Filled in 2026-09-14 from the school portal's academic calendar
# screenshot. That screenshot labeled the current term "Semester 3: 08 Sep
# to 17 Dec 2025" and the next one "Semester 4: 06 Jan to 24 Apr 2026" - a
# year behind this tracker's actual dates (your Semester 3 courses are
# already running now, in Sept 2026 - e.g. Finance session 1 is dated
# 2026-09-14). Read as last year's printing of the same recurring template,
# so every date below is shifted forward one year from what the screenshot
# showed. Double-check against the portal if that assumption looks wrong.
#
# The screenshot also showed a "Spring Semester (S8/IBEA/Exchange)" term
# break (25 Feb-12 Jun track) - left out since that's a different program
# stage/exchange track, not necessarily yours; add it (shifted the same way)
# if it does apply to you.
holidays:
  - id: semester-3-term-break
    name: "Semester 3 Term Break"
    start_date: "2026-10-20"
    end_date: "2026-10-24"
    count_from: "2026-09-08"  # Semester 3 term start, per the screenshot (shifted +1yr)
  - id: semester-4-term-break
    name: "Semester 4 Term Break"
    start_date: "2027-02-16"
    end_date: "2027-02-20"
    count_from: "2027-01-06"  # Semester 4 term start, per the screenshot (shifted +1yr)
