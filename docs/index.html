<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ESSEC Academic Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    color-scheme: light;
    --page:        #f9f9f7;
    --surface:     #fcfcfb;
    --ink:         #0b0b0b;
    --ink-2:       #52514e;
    --ink-muted:   #898781;
    --hairline:    #e1e0d9;
    --baseline:    #c3c2b7;
    --border:      rgba(11,11,11,0.10);
    --accent:      #2a78d6;
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page:      #0d0d0d;
      --surface:   #1a1a19;
      --ink:       #ffffff;
      --ink-2:     #c3c2b7;
      --ink-muted: #898781;
      --hairline:  #2c2c2a;
      --baseline:  #383835;
      --border:    rgba(255,255,255,0.10);
      --accent:    #3987e5;
      --status-good:     #0ca30c;
      --status-warning:  #fab219;
      --status-critical: #d03b3b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page:      #0d0d0d;
    --surface:   #1a1a19;
    --ink:       #ffffff;
    --ink-2:     #c3c2b7;
    --ink-muted: #898781;
    --hairline:  #2c2c2a;
    --baseline:  #383835;
    --border:    rgba(255,255,255,0.10);
    --accent:    #3987e5;
    --status-good:     #0ca30c;
    --status-warning:  #fab219;
    --status-critical: #d03b3b;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--page);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main {
    max-width: 880px;
    margin: 0 auto;
    padding: 24px 20px 64px;
  }
  header {
    max-width: 880px;
    margin: 0 auto;
    padding: 32px 20px 8px;
  }
  h1 {
    font-size: 22px;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--ink-2);
    font-size: 13px;
    margin: 0;
  }
  h2 {
    font-size: 15px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--ink-2);
    margin: 40px 0 14px;
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .course-row-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
  }
  .course-name {
    font-weight: 600;
    font-size: 15px;
  }
  .course-count {
    color: var(--ink-2);
    font-size: 13px;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .progress-track {
    height: 8px;
    border-radius: 4px;
    background: var(--hairline);
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    border-radius: 4px;
    background: var(--accent);
  }
  .next-up {
    margin-top: 10px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .next-up strong {
    color: var(--ink);
    font-weight: 600;
  }
  .tag-list {
    margin-top: 6px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .tag {
    font-size: 12px;
    color: var(--ink-2);
    background: var(--page);
    border: 1px solid var(--hairline);
    border-radius: 999px;
    padding: 2px 9px;
  }
  .deadline-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .status-dot {
    flex: none;
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .status-dot.red    { background: var(--status-critical); }
  .status-dot.yellow { background: var(--status-warning); }
  .status-dot.green  { background: var(--status-good); }
  .deadline-main {
    flex: 1 1 auto;
    min-width: 0;
  }
  .deadline-name {
    font-weight: 600;
    font-size: 14px;
  }
  .deadline-meta {
    color: var(--ink-2);
    font-size: 13px;
    margin-top: 2px;
  }
  .deadline-right {
    flex: none;
    text-align: right;
    font-size: 13px;
  }
  .deadline-days {
    font-weight: 600;
    font-variant-numeric: tabular-nums;
  }
  .deadline-label {
    color: var(--ink-2);
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }
  .empty {
    color: var(--ink-muted);
    font-size: 13px;
    padding: 8px 2px;
  }
  footer {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 20px 40px;
    color: var(--ink-muted);
    font-size: 12px;
  }
</style>
</head>
<body>
<header>
  <h1>ESSEC Academic Tracker</h1>
  <p class="subtitle" id="generated-at">Loading…</p>
</header>
<main>
  <section>
    <h2>Progress by course</h2>
    <div id="courses"></div>
  </section>
  <section>
    <h2>Deadlines</h2>
    <div id="deadlines"></div>
  </section>
</main>
<footer>Auto-generated by GitHub Actions from courses.yaml, sessions/, and deadlines.yaml. This page never receives your calendar URL or ntfy topic — only the data shown here.</footer>

<script>
function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function renderCourses(courses) {
  const root = document.getElementById("courses");
  root.innerHTML = "";
  for (const c of courses) {
    const held = c.held_sessions ?? c.done_sessions;
    const pct = c.total_sessions ? Math.round((held / c.total_sessions) * 100) : 0;
    const card = document.createElement("div");
    card.className = "card";

    let nextUpHtml = "";
    if (c.next_up) {
      const tags = (c.next_up.outstanding || [])
        .map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("");
      nextUpHtml = `
        <div class="next-up">
          Next up: <strong>Session ${c.next_up.session_number}</strong>
          — ${escapeHtml(c.next_up.chapter)}
        </div>
        <div class="tag-list">${tags}</div>`;
    } else if (held >= c.total_sessions && c.total_sessions > 0) {
      nextUpHtml = `<div class="next-up">All sessions complete.</div>`;
    } else {
      nextUpHtml = `<div class="next-up">No session pending review right now.</div>`;
    }

    card.innerHTML = `
      <div class="course-row-top">
        <div class="course-name">${escapeHtml(c.name)}</div>
        <div class="course-count">${held}/${c.total_sessions} sessions held</div>
      </div>
      <div class="progress-track">
        <div class="progress-fill" style="width:${pct}%"></div>
      </div>
      ${nextUpHtml}
    `;
    root.appendChild(card);
  }
}

function renderDeadlines(deadlines) {
  const root = document.getElementById("deadlines");
  root.innerHTML = "";
  if (!deadlines.length) {
    root.innerHTML = '<div class="card empty">No deadlines entered yet — add them to deadlines.yaml.</div>';
    return;
  }
  const labelFor = (color, days) => {
    if (days < 0) return "Overdue";
    if (color === "red") return "Critical";
    if (color === "yellow") return "Watch";
    return "On track";
  };
  for (const d of deadlines) {
    const card = document.createElement("div");
    card.className = "card deadline-row";
    const daysText = d.days_remaining < 0
      ? `${Math.abs(d.days_remaining)}d overdue`
      : `${d.days_remaining}d left`;
    card.innerHTML = `
      <div class="status-dot ${d.color}"></div>
      <div class="deadline-main">
        <div class="deadline-name">${escapeHtml(d.name)}</div>
        <div class="deadline-meta">${escapeHtml(d.course_name || d.course)} · due ${escapeHtml(d.due_date)} · ${d.weight_pct}% of grade</div>
      </div>
      <div class="deadline-right">
        <div class="deadline-days">${daysText}</div>
        <div class="deadline-label">${labelFor(d.color, d.days_remaining)}</div>
      </div>
    `;
    root.appendChild(card);
  }
}

fetch("data.json", { cache: "no-store" })
  .then(r => r.json())
  .then(data => {
    document.getElementById("generated-at").textContent =
      "Last updated " + new Date(data.generated_at).toLocaleString();
    renderCourses(data.courses || []);
    renderDeadlines(data.deadlines || []);
  })
  .catch(err => {
    document.getElementById("generated-at").textContent =
      "Could not load data.json — has the tracker workflow run yet?";
    console.error(err);
  });
</script>
</body>
</html>
