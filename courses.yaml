# Master course + syllabus definitions.
# Filled in from ESSEC syllabuses + lecture materials (2026-09-13).
# `calendar_match`: lowercase substrings matched against your ICS event
# titles - confirmed against the real feed (e.g. "Cost & Budgets Group A -
# Jee Huay TAN", "Finance 1 Group A - Rick MARCHESE").
#
# Notes on gaps (fill in once known):
# - Marketing Research sessions 3, 4, 6, 7, 9: topics not in the materials
#   found (only sessions 1, 2, 5, 8, 10 had slide decks/syllabus detail).
# - Business Law: no separate syllabus PDF was found; the 10-topic list
#   below comes from the "Course syllabus" slide in the Session 1 deck,
#   with sessions 1-2 mapped to the actual lesson pptx titles.
#
# 6th course added 2026-09-13: Communication Skills (a.k.a. "Professional
# Comm" on the calendar) wasn't in the original 5-course scope, but its full
# syllabus was provided, and its calendar events already appear in the ICS
# feed as "Professional Comm Group 2 - Sheila Esther WEE" - tracked the same
# way as the other 5.

courses:
  - id: business-law
    name: Business Law
    total_sessions: 10
    calendar_match:
      - "business law"
    sessions:
      - number: 1
        chapter: "Introduction: Offer and Acceptance (Law of Contract)"
      - number: 2
        chapter: "Offer and Acceptance (continued)"
      - number: 3
        chapter: "Consideration and Intention to Create Legal Relations"
      - number: 4
        chapter: "Terms of a Contract"
      - number: 5
        chapter: "Exclusion Clauses"
      - number: 6
        chapter: "Vitiating Factors - Part 1"
      - number: 7
        chapter: "Vitiating Factors - Part 2"
      - number: 8
        chapter: "Presentation"
      - number: 9
        chapter: "Presentation"
      - number: 10
        chapter: "Studying Samples of Contract"

  - id: finance
    name: Finance
    total_sessions: 10
    calendar_match:
      - "finance"
    sessions:
      - number: 1
        chapter: "Overview of Finance (Intro to finance, corporate financial management, financial markets) - BDM Ch.1"
      - number: 2
        chapter: "Financial Statement Analysis (1/2): accounting statements to cash flow - BDM Ch.2"
      - number: 3
        chapter: "Financial Statement Analysis (2/2): cash flow reconciliation, sources and uses of funds - BDM Ch.2"
      - number: 4
        chapter: "Time Value of Money and Investment Decision Rules (PV, NPV, IRR, payback) - BDM Ch.4, 7"
      - number: 5
        chapter: "Revision for Midterm; Midterm Exam"
      - number: 6
        chapter: "Capital Budgeting and Cash-Flow Planning - BDM Ch.8"
      - number: 7
        chapter: "Bond Valuation (cash flows, pricing, yields) - BDM Ch.6"
      - number: 8
        chapter: "Stock Valuation (dividend-discount model, equity comparables) - BDM Ch.9"
      - number: 9
        chapter: "Capital Structure and Financial Leverage (Modigliani-Miller) - BDM Ch.14, 15"
      - number: 10
        chapter: "Final Exam Revision; Final Exam"

  - id: cost-budgets
    name: Cost & Budgets
    total_sessions: 10
    calendar_match:
      - "cost & budget"
      - "cost and budget"
      - "cost & budgets"
    sessions:
      - number: 1
        chapter: "Introduction: financial accounting to management accounting; types of costs"
      - number: 2
        chapter: "Full costs (1/2)"
      - number: 3
        chapter: "Full costs (2/2); Activity-Based Costing (ABC)"
      - number: 4
        chapter: "Job costing; the Cost-Volume-Profit (CVP) model"
      - number: 5
        chapter: "Costs & Decisions; relevant costs"
      - number: 6
        chapter: "Introduction to the budget"
      - number: 7
        chapter: "Preparation of budgets: sales budget to cash flow budget"
      - number: 8
        chapter: "Standard costs and staff budgets"
      - number: 9
        chapter: "Variance analysis (1/2)"
      - number: 10
        chapter: "Variance analysis (2/2); conclusion; revisions for final exam"

  - id: international-economics
    name: International Economics
    total_sessions: 10
    calendar_match:
      - "international economics"
    sessions:
      - number: 1
        chapter: "Globalisation, the Gravity Model & Pluralist Perspectives (bullwhip game, ungraded)"
      - number: 2
        chapter: "Comparative Advantage, Technology & Strategic Offshoring"
      - number: 3
        chapter: "Increasing Returns, Firm Heterogeneity & Intra-Industry Trade (Memo 1 released)"
      - number: 4
        chapter: "Factor Movements: FDI, Migration & Global Capital"
      - number: 5
        chapter: "Trade Policy, Tariffs & the Political Economy of Protection (Memo 1 due)"
      - number: 6
        chapter: "Real Assets, Ports & Global Logistics (Real Asset Market Entry Pitch)"
      - number: 7
        chapter: "Exchange Rates & Currency Risk for the Firm"
      - number: 8
        chapter: "Open-Economy Macro, Global Imbalances & Institutions (Memo 2 released)"
      - number: 9
        chapter: "Emerging Markets, Country Risk & Institutional Quality"
      - number: 10
        chapter: "Geopolitics & the Future of Globalisation (Memo 2 due; G20 Summit Simulation)"

  - id: marketing-research
    name: Marketing Research
    total_sessions: 10
    calendar_match:
      - "marketing research"
    sessions:
      - number: 1
        chapter: "Course intro; the Market Research Process; secondary data (Deezer case)"
      - number: 2
        chapter: "Primary/Secondary/Panel Data; Group Project briefing & brand selection"
      - number: 3
        chapter: "TODO: fill in from syllabus (materials not found)"
      - number: 4
        chapter: "TODO: fill in from syllabus (materials not found)"
      - number: 5
        chapter: "Group Project Part 1 due (secondary research, focus group, interviews) - 50% of project grade"
      - number: 6
        chapter: "TODO: fill in from syllabus (materials not found)"
      - number: 7
        chapter: "TODO: fill in from syllabus (materials not found)"
      - number: 8
        chapter: "Group Project Part 2 due (hypotheses, sampling plan, Qualtrics survey) - 5% of project grade"
      - number: 9
        chapter: "TODO: fill in from syllabus (materials not found)"
      - number: 10
        chapter: "Group Project Part 3 due (peer review, analysis, final recommendations) - 45% of project grade"

  - id: communication-skills
    name: Communication Skills
    total_sessions: 10
    calendar_match:
      - "professional comm"
    sessions:
      - number: 1
        chapter: "Communicating with Impact (\"Sticky\" Communication)"
      - number: 2
        chapter: "Communicating with Impact (\"Sticky\" Communication)"
      - number: 3
        chapter: "Communicating with Impact (\"Sticky\" Communication)"
      - number: 4
        chapter: "Communicating with Impact - Individual Oral Assignment Presentations"
      - number: 5
        chapter: "Ethics of Communication"
      - number: 6
        chapter: "Ethics of Communication - Individual Written Assignment due"
      - number: 7
        chapter: "Communicating with Empathy"
      - number: 8
        chapter: "Communicating with Empathy"
      - number: 9
        chapter: "Communicating with Impact and Empathy - Group Presentations"
      - number: 10
        chapter: "Communicating with Impact and Empathy - Group Presentations"
