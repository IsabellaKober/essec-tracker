# Master course + syllabus definitions.
# Filled in from ESSEC syllabuses + lecture materials (2026-09-13).
# `calendar_match`: lowercase substrings matched against your ICS event
# titles - confirmed against the real feed (e.g. "Cost & Budgets Group A -
# Jee Huay TAN", "Finance 1 Group A - Rick MARCHESE").
#
# Notes on gaps (fill in once known):
# - Marketing Research sessions 3, 4, 6, 7, 9: topics not in the materials
#   found (only sessions 1, 2, 5, 8, 10 had slide decks/syllabus detail).
# - Business Law: no separate syllabus PDF was found; the 10-topic list
#   below comes from the "Course syllabus" slide in the Session 1 deck,
#   with sessions 1-2 mapped to the actual lesson pptx titles.
#
# 6th course added 2026-09-13: Communication Skills (a.k.a. "Professional
# Comm" on the calendar) wasn't in the original 5-course scope, but its full
# syllabus was provided, and its calendar events already appear in the ICS
# feed as "Professional Comm Group 2 - Sheila Esther WEE" - tracked the same
# way as the other 5.
#
# Spanish + Chinese added 2026-09-13: neither syllabus gives session-by-
# session topics (only grading policy + a couple of dated notes), so most
# sessions are still TODO. Confirmed 10 real sessions each on the calendar.
#
# Post-class checklist, per course (added 2026-09-14, refined 2026-09-14
# after confirming the real per-course tasks). Every course now sets its own
# `checklist:` mapping (checklist item key -> label); check_ics.py falls back
# to DEFAULT_CHECKLIST only if a course omits `checklist:` entirely - an
# empty mapping (`checklist: {}`) is a deliberate "nothing to track, just
# mark the session done" and is NOT treated as "use the default".
#
# - "Read next chapter": only Finance and International Economics assign
#   textbook reading (BDM chapters / weekly readings).
# - Going over lecture notes + writing/answering practice questions + writing
#   a summary: applies to Business Law, Finance, Cost & Budgets,
#   International Economics, Marketing Research. Does NOT apply to Spanish,
#   Communication Skills, or Chinese.
# - Marketing Research additionally has a practice quiz on Moodle after every
#   class.
# - Communication Skills and Spanish: no post-class task is tracked (confirmed
#   2026-09-14) - sessions still go to pending_review so you can mark them
#   done, just with an empty checklist.
# - Chinese: no generic tasks; instead (a) finish the next 3 video lessons
#   before the next class, and (b) review that session's material once
#   (ideally twice) a week.
#
# Biweekly deadline check-in (added 2026-09-14): Communication Skills and
# Spanish have an empty post-class checklist, so nothing else prompts a
# periodic look at their upcoming deadlines - a `checkin_interval_days: 14`
# field below makes scripts/send_deadline_checkins.py nudge you every 2
# weeks to review that course's deadlines.yaml entries so none get missed.

courses:
  - id: business-law
    name: Business Law
    total_sessions: 10
    calendar_match:
      - "business law"
    checklist:
      review_notes: "Go over the lecture notes"
      write_summary: "Write a summary"
      practice_questions: "Write and answer practice questions"
    sessions:
      - number: 1
        chapter: "Introduction: Offer and Acceptance (Law of Contract)"
      - number: 2
        chapter: "Offer and Acceptance (continued)"
      - number: 3
        chapter: "Consideration and Intention to Create Legal Relations"
      - number: 4
        chapter: "Terms of a Contract"
      - number: 5
        chapter: "Exclusion Clauses"
      - number: 6
        chapter: "Vitiating Factors - Part 1"
      - number: 7
        chapter: "Vitiating Factors - Part 2"
      - number: 8
        chapter: "Presentation"
      - number: 9
        chapter: "Presentation"
      - number: 10
        chapter: "Studying Samples of Contract"

  - id: finance
    name: Finance
    total_sessions: 10
    calendar_match:
      - "finance"
    checklist:
      read_chapter: "Read next chapter"
      review_notes: "Go over the lecture notes"
      write_summary: "Write a summary"
      practice_questions: "Write and answer practice questions"
    sessions:
      - number: 1
        chapter: "Overview of Finance (Intro to finance, corporate financial management, financial markets) - BDM Ch.1"
      - number: 2
        chapter: "Financial Statement Analysis (1/2): accounting statements to cash flow - BDM Ch.2"
      - number: 3
        chapter: "Financial Statement Analysis (2/2): cash flow reconciliation, sources and uses of funds - BDM Ch.2"
      - number: 4
        chapter: "Time Value of Money and Investment Decision Rules (PV, NPV, IRR, payback) - BDM Ch.4, 7"
      - number: 5
        chapter: "Revision for Midterm; Midterm Exam"
      - number: 6
        chapter: "Capital Budgeting and Cash-Flow Planning - BDM Ch.8"
      - number: 7
        chapter: "Bond Valuation (cash flows, pricing, yields) - BDM Ch.6"
      - number: 8
        chapter: "Stock Valuation (dividend-discount model, equity comparables) - BDM Ch.9"
      - number: 9
        chapter: "Capital Structure and Financial Leverage (Modigliani-Miller) - BDM Ch.14, 15"
      - number: 10
        chapter: "Final Exam Revision; Final Exam"

