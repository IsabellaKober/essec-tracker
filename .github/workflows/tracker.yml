name: Academic Tracker

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: academic-tracker
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check ICS feed for ended sessions
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
        run: python scripts/check_ics.py

      - name: Fetch upcoming schedule (next class, breaks between classes)
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
        run: python scripts/fetch_schedule.py

      - name: Process done-commands from ntfy
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/process_commands.py

      - name: Send biweekly deadline check-ins
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/send_deadline_checkins.py

      - name: Rebuild dashboard data
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/build_dashboard_data.py

      - name: Commit changes
        run: |
          git config user.name "essec-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add sessions docs/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Automated tracker update"
            git pull --rebase origin main
            git push
          else
            echo "No changes to commit."
          fi

      - name: Send pending-review notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/send_notifications.py
